# Kito HTTP+JSON contract. Generated by bun run sync:kito-contract.
# Covers /ktai/* and provider.models.probe; upstream routes are maintained in packages/protocol.
openapi: 3.1.0
info:
  title: Kito Account and Model Probe API
  version: 0.0.1
  description: Experimental HttpApi surface for selected instance routes.
paths:
  /ktai/account:
    get:
      tags:
        - ktai
      operationId: v2.ktai.account.get
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiAccount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiAccount"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Return the signed-in KT Identity account and the NewAPI spendable balance when it is readable.
      summary: Get Kito account
  /ktai/ensure:
    post:
      tags:
        - ktai
      operationId: v2.ktai.ensure
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiEnsure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiEnsure"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Create or refresh the managed NewAPI token named kito.
      summary: Ensure Kito API key
  /ktai/credential:
    get:
      tags:
        - ktai
      operationId: v2.ktai.credential.get
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiCredential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiCredential"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
      description: Report whether Identity and the managed API key are present.
      summary: Get Kito credential flags
  /ktai/logout:
    post:
      tags:
        - ktai
      operationId: v2.ktai.logout
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiLogout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiLogout"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
      description: Revoke the current KT Identity session and clear the local Kito key.
      summary: Sign out of Kito
  /ktai/wallet/deposit-address:
    get:
      tags:
        - ktai
      operationId: v2.ktai.wallet.depositAddress
      parameters:
        - name: chain
          in: query
          schema:
            anyOf:
              - type: string
              - type: "null"
          required: false
        - name: asset
          in: query
          schema:
            anyOf:
              - type: string
              - type: "null"
          required: false
      security:
        []
      responses:
        "200":
          description: KtaiDepositAddress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiDepositAddress"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Return a per-account deposit address for the requested chain.
      summary: Get deposit address
  /ktai/wallet/crypto/status:
    get:
      tags:
        - ktai
      operationId: v2.ktai.wallet.cryptoStatus
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiCryptoStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiCryptoStatus"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Return the Identity ledger balance used to detect an on-chain deposit.
      summary: Get crypto recharge status
  /ktai/wallet/ktpay/info:
    get:
      tags:
        - ktai
      operationId: v2.ktai.wallet.ktpay.info
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiKtpayInfo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiKtpayInfo"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Return WeChat and Alipay cashier options.
      summary: Get KTPay info
  /ktai/wallet/ktpay/pay:
    post:
      tags:
        - ktai
      operationId: v2.ktai.wallet.ktpay.pay
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiKtpayOrder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiKtpayOrder"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Create a WeChat or Alipay cashier order.
      summary: Create KTPay order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  anyOf:
                    - type: number
                    - type: string
                      enum:
                        - Infinity
                        - "-Infinity"
                        - NaN
                method:
                  type: string
              required:
                - amount
                - method
              additionalProperties: false
        required: true
  "/ktai/wallet/ktpay/status/{order_id}":
    get:
      tags:
        - ktai
      operationId: v2.ktai.wallet.ktpay.status
      parameters:
        - name: order_id
          in: path
          schema:
            type: string
          required: true
      security:
        []
      responses:
        "200":
          description: KtaiKtpayStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiKtpayStatus"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Return the current status of a KTPay cashier order.
      summary: Get KTPay status
  /ktai/models/probe:
    post:
      tags:
        - ktai
      operationId: v2.ktai.models.probe
      parameters:
        []
      security:
        []
      responses:
        "200":
          description: KtaiModelProbe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaiModelProbe"
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "502":
          description: BadGatewayError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: Send a minimal chat request per requested model with the managed Kito key and report per-model availability.
      summary: Probe Kito models
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelIDs:
                  type: array
                  items:
                    type: string
              required:
                - modelIDs
              additionalProperties: false
        required: true
  "/api/provider/{providerID}/models/probe":
    post:
      tags:
        - provider
      operationId: v2.provider.models.probe
      parameters:
        - name: providerID
          in: path
          schema:
            $ref: "#/components/schemas/Provider.ID"
          required: true
        - name: location
          in: query
          schema:
            anyOf:
              - type: object
                properties:
                  directory:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties: false
              - type: "null"
          required: false
          style: deepObject
          explode: true
      security:
        []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    $ref: "#/components/schemas/Location.PublicRef"
                  data:
                    $ref: "#/components/schemas/ProviderModelProbe"
                required:
                  - location
                  - data
                additionalProperties: false
        "400":
          description: InvalidRequestError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestErrorEncoded"
        "401":
          description: UnauthorizedError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorEncoded"
        "404":
          description: ProviderNotFoundError | LocationNotFoundError
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ProviderNotFoundErrorEncoded"
                  - $ref: "#/components/schemas/LocationNotFoundErrorEncoded"
        "503":
          description: ServiceUnavailableError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailableErrorEncoded"
      description: "Send a minimal request per requested model through the provider's resolved endpoint and credentials, and report per-model availability. Kito models use /ktai/models/probe instead."
      summary: Probe provider models
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelIDs:
                  type: array
                  items:
                    type: string
              required:
                - modelIDs
              additionalProperties: false
        required: true
components:
  schemas:
    AbsolutePath:
      type: string
    Agent.Color:
      type: string
    Agent.ID:
      type: string
    Agent.Info:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Agent.ID"
        name:
          type: string
        model:
          $ref: "#/components/schemas/Model.Ref"
        request:
          $ref: "#/components/schemas/Provider.Request"
        system:
          type: string
        description:
          type: string
        mode:
          type: string
          enum:
            - subagent
            - primary
            - all
        hidden:
          type: boolean
        color:
          $ref: "#/components/schemas/Agent.Color"
        steps:
          type: integer
          exclusiveMinimum: 0
        permissions:
          $ref: "#/components/schemas/Permission.Ruleset"
      required:
        - id
        - name
        - request
        - mode
        - hidden
        - permissions
      additionalProperties: false
    AgentNotFoundErrorEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - AgentNotFoundError
        agentID:
          type: string
        message:
          type: string
      required:
        - _tag
        - agentID
        - message
      additionalProperties: false
    BadGatewayErrorEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - BadGatewayError
        message:
          type: string
        service:
          anyOf:
            - type: string
            - type: "null"
      required:
        - _tag
        - message
      additionalProperties: false
    Command.Info:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
      additionalProperties: false
    CommandExecutionErrorEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - CommandExecutionError
        command:
          type: string
        message:
          type: string
      required:
        - _tag
        - command
        - message
      additionalProperties: false
    CommandNotFoundErrorEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
            - CommandNotFoundError
        command:
          type: string
        message:
          type: string
      required:
        - _tag
        - command
        - message
      additionalProperties: false
    Config.AgentEncoded:
      type: object
      properties:
        model:
          anyOf:
            - type: string
              pattern: "^[^/#]+\\/[^#]+(?:#[^#]+)?$"
            - type: object
              properties:
                providerID:
                  type: string
                  pattern: "^[^/#]+$"
                model:
                  type: string
                  pattern: "^[^#]+$"
                variant:
                  type: string
                  pattern: "^[^#]+$"
              required:
                - providerID
                - model
              additionalProperties: false
        request:
          type: object
          properties:
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: object
          additionalProperties: false
        system:
          type: string
        description:
          type: string
        mode:
          type: string
          enum:
            - subagent
            - primary
            - all
        hidden:
          type: boolean
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        steps:
          type: integer
          exclusiveMinimum: 0
        disabled:
          type: boolean
        permissions:
          $ref: "#/components/schemas/Permission.Ruleset"
      additionalProperties: false
    Config.CommandEncoded:
      type: object
      properties:
        template:
          type: string
        description:
          type: string
        agent:
          type: string
        model:
          anyOf:
            - type: string
              pattern: "^[^/#]+\\/[^#]+(?:#[^#]+)?$"
            - type: object
              properties:
                providerID:
                  type: string
                  pattern: "^[^/#]+$"
                model:
                  type: string
                  pattern: "^[^#]+$"
                variant:
                  type: string
                  pattern: "^[^#]+$"
              required:
                - providerID
                - model
              additionalProperties: false
        subagent:
          type: boolean
        subtask:
          type: boolean
          description: Deprecated alias for subagent.
      required:
        - template
      additionalProperties: false
    Config.DirectoryEncoded:
      type: object
      properties:
        type:
          type: string
          enum:
            - directory
        path:
          $ref: "#/components/schemas/AbsolutePath"
      required:
        - type
        - path
      additionalProperties: false
    Config.DocumentEncoded:
      type: object
      properties:
        type:
          type: string
          enum:
            - document
        path:
          $ref: "#/components/schemas/AbsolutePath"
        info:
          $ref: "#/components/schemas/Config.InfoEncoded"
      required:
        - type
        - info
      additionalProperties: false
    Config.Entry:
      anyOf:
        - $ref: "#/components/schemas/Config.DocumentEncoded"
        - $ref: "#/components/schemas/Config.DirectoryEncoded"
    Config.Formatter.EntryEncoded:
      type: object
      properties:
        disabled:
          type: boolean
        command:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        extensions:
          type: array
          items:
            type: string
      additionalProperties: false
    Config.InfoEncoded:
      type: object
      properties:
        $schema:
          type: string
        shell:
          type: string
        model:
          anyOf:
            - type: string
              pattern: "^[^/#]+\\/[^#]+(?:#[^#]+)?$"
            - type: object
              properties:
                providerID:
                  type: string
                  pattern: "^[^/#]+$"
                model:
                  type: string
                  pattern: "^[^#]+$"
                variant:
                  type: string
                  pattern: "^[^#]+$"
              required:
                - providerID
                - model
              additionalProperties: false
        default_agent:
          type: string
        update:
          type: string
          enum:
            - disable
            - notify
            - auto
        share:
          type: string
          enum:
            - manual
            - auto
            - disabled
        enterprise:
          type: object
          properties:
            url:
              type: string
          additionalProperties: false
        username:
          type: string
        permissions:
          $ref: "#/components/schemas/Permission.Ruleset"
        agents:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Config.AgentEncoded"
        snapshots:
          type: boolean
        watcher:
          type: object
          properties:
            ignore:
              type: array
              items:
                type: string
          additionalProperties: false
        formatter:
          anyOf:
            - type: boolean
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/Config.Formatter.EntryEncoded"
        lsp:
          anyOf:
            - type: boolean
            - type: object
              additionalProperties:
                anyOf:
                  - type: object
                    properties:
                      disabled:
                        type: boolean
                        enum:
                          - true
                    required:
                      - disabled
                    additionalProperties: false
                  - $ref: "#/components/schemas/Config.LSP.ServerEncoded"
        media:
          type: object
          properties:
            image:
              type: object
              properties:
                auto_resize:
                  type: boolean
                max_width:
                  type: integer
                  exclusiveMinimum: 0
                max_height:
                  type: integer
                  exclusiveMinimum: 0
                max_base64_bytes:
                  type: integer
                  exclusiveMinimum: 0
              additionalProperties: false
          additionalProperties: false
        tool_output:
          type: object
          properties:
            max_lines:
              type: integer
              exclusiveMinimum: 0
            max_bytes:
              type: integer
              exclusiveMinimum: 0
          additionalProperties: false
        mcp:
          type: object
          properties:
            timeout:
              type: object
              properties:
                startup:
                  type: integer
                  exclusiveMinimum: 0
                catalog:
                  type: integer
                  exclusiveMinimum: 0
                execution:
                  type: integer
                  exclusiveMinimum: 0
              additionalProperties: false
            servers:
              type: object
              additionalProperties:
                anyOf:
                  - $ref: "#/components/schemas/Mcp.LocalConfigEncoded"
                  - $ref: "#/components/schemas/Mcp.RemoteConfigEncoded"
          additionalProperties: false
        compaction:
          type: object
          properties:
            auto:
              type: boolean
            keep:
              type: object
              properties:
                tokens:
                  type: integer
                  minimum: 0
              additionalProperties: false
            buffer:
              type: integer
              minimum: 0
          additionalProperties: false
        skills:
          type: array
          items:
            type: string
        commands:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Config.CommandEncoded"
        instructions:
          type: array
          items:
            type: string
        references:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - $ref: "#/components/schemas/Config.Reference.GitEncoded"
              - $ref: "#/components/schemas/Config.Reference.LocalEncoded"
        websearch:
          anyOf:
            - type: boolean
              enum:
                - false
            - $ref: "#/components/schemas/ConfigWebSearch.InfoEncoded"
        plugins:
          type: array
          items:
            anyOf:
              - type: string
              - $ref: "#/components/schemas/Config.Plugin.EntryEncoded"
        worktree:
          $ref: "#/components/schemas/Config.Worktree"
        warming:
          anyOf:
            - type: boolean
            - $ref: "#/components/schemas/Config.WarmingEncoded"
        providers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Config.ProviderEncoded"
        experimental:
          type: object
          properties:
            portable_shell_scanner:
              type: boolean
            subagent_depth:
              type: integer
              minimum: 0
            policies:
              type: array
              items:
                type: object
                properties:
                  action:
                    type: string
                    enum:
                      - provider.use
                      - tool.use
                      - integration.use
                  resource:
                    type: string
                  effect:
                    type: string
                    enum:
                      - allow
                      - deny
                required:
                  - action
                  - resource
                  - effect
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    Config.LSP.ServerEncoded:
      type: object
      properties:
        command:
          type: array
          items:
            type: string
        extensions:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        env:
          type: object
          additionalProperties:
            type: string
        initialization:
          type: object
      required:
        - command
      additionalProperties: false
    Config.Model.Capabilities:
      type: object
      properties:
        tools:
          type: boolean
        input:
          type: array
          items:
            type: string
        output:
          type: array
          items:
            type: string
      additionalProperties: false
    Config.Model.CostEncoded:
      type: object
      properties:
        tier:
          type: object
          properties:
            type:
              type: string
              enum:
                - context
            size:
              type: integer
          required:
            - type
            - size
          additionalProperties: false
        input:
          $ref: "#/components/schemas/Money.USDPerMillionTokens"
        output:
          $ref: "#/components/schemas/Money.USDPerMillionTokens"
        cache:
          type: object
          properties:
            read:
              $ref: "#/components/schemas/Money.USDPerMillionTokens"
            write:
              $ref: "#/components/schemas/Money.USDPerMillionTokens"
          additionalProperties: false
      required:
        - input
        - output
      additionalProperties: false
    Config.Model.Settings:
      type: object
