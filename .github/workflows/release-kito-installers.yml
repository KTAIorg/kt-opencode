name: Release · Kito Installers

run-name: Release Installers | ${{ inputs.tag || github.ref_name }}

# Builds unsigned Kito installers for a kito-v* tag and publishes them as a
# GitHub Release. Publishing fires release-kito.yml, which registers the
# assets into Release Service at rollout 0.
#
# Kito tags live in their own kito-v* namespace: plain v* tags on this repo
# track upstream opencode releases (v1.18.x and climbing) and must never
# fire the Kito pipeline.
on:
  push:
    tags:
      - "kito-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing kito-v* tag to build and publish installers for
        required: true
        type: string

concurrency:
  group: release-kito-installers-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve tag and version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi
          case "$tag" in
            kito-v*) ;;
            *) echo "tag must start with 'kito-v', got: $tag" >&2; exit 1 ;;
          esac
          version="${tag#kito-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Kito version: $version (tag $tag)"

  build-windows:
    name: Build Windows Installer
    needs:
      - resolve-version
      - build-cli
    if: github.repository_owner == 'KTAIorg' || github.repository_owner == 'ktaiorg'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kito-cli-dist
          path: packages/cli/dist

      - name: Prepare desktop bundle
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Pin package version to the tag
        working-directory: packages/desktop
        shell: bash
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          bun -e 'const file = "./package.json"
          const pkg = await Bun.file(file).json()
          pkg.version = process.env.OPENCODE_VERSION
          await Bun.write(file, JSON.stringify(pkg, null, 2) + "\n")'

      - name: Build desktop application
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package unsigned Windows installer
        working-directory: packages/desktop
        run: bunx electron-builder --win --publish never --config electron-builder.config.ts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KTAI_UNSIGNED_BUILD: "1"
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kito-windows-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error

  build-cli:
    name: Build CLI
    needs: resolve-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      # Cross-compile the Kito CLI for every desktop target from one Linux
      # host; each installer job copies in only its runner-native binary.
      - name: Build CLI binaries
        working-directory: packages/cli
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kito-cli-dist
          path: packages/cli/dist/cli-*
          if-no-files-found: error

  build-macos:
    name: Build macOS Installers (${{ matrix.arch }})
    needs:
      - resolve-version
      - build-cli
    if: github.repository_owner == 'KTAIorg' || github.repository_owner == 'ktaiorg'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kito-cli-dist
          path: packages/cli/dist

      - name: Prepare desktop bundle
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Pin package version to the tag
        working-directory: packages/desktop
        shell: bash
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          bun -e 'const file = "./package.json"
          const pkg = await Bun.file(file).json()
          pkg.version = process.env.OPENCODE_VERSION
          await Bun.write(file, JSON.stringify(pkg, null, 2) + "\n")'

      - name: Build desktop application
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package unsigned macOS installers
        working-directory: packages/desktop
        run: bunx electron-builder --mac --publish never --config electron-builder.config.ts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KTAI_UNSIGNED_BUILD: "1"
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kito-macos-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve-version
      - build-windows
      - build-macos
    if: github.repository_owner == 'KTAIorg' || github.repository_owner == 'ktaiorg'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    environment: prod
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_TITLE: Kito ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kito-windows-x64
          path: release-assets/windows-x64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kito-macos-x64
          path: release-assets/macos-x64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kito-macos-arm64
          path: release-assets/macos-arm64

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets-flat
          # Fixed scan order so a duplicated metadata file (latest-mac.yml is
          # produced per mac arch) resolves deterministically: the first copy
          # wins (arm64), later arches are skipped. Installer binaries must
          # still be unique.
          while IFS= read -r -d '' asset; do
            destination="release-assets-flat/$(basename "$asset")"
            if [[ -e "$destination" ]]; then
              if [[ "$destination" == *.yml ]]; then
                echo "skipping duplicate metadata $(basename "$asset") from ${asset%%/*}"
                continue
              fi
              echo "Duplicate release asset name: $(basename "$asset")" >&2
              exit 1
            fi
            cp "$asset" "$destination"
          done < <(find release-assets/windows-x64 release-assets/macos-arm64 release-assets/macos-x64 -type f -print0)
          (
            cd release-assets-flat
            sha256sum ./* > SHA256SUMS
          )
          find release-assets-flat -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          ## Kito ${VERSION}

          - Windows x64 安装包（未签名 EXE）
          - macOS Apple Silicon / Intel（未签名 DMG、ZIP）
          - \`SHA256SUMS\`：全部 Release 资产的 SHA256 校验值

          当前构建未进行 Windows 代码签名、Apple Developer ID 签名或 macOS 公证，安装时可能出现操作系统安全提示。
          EOF_NOTES

      - name: Publish versioned GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets-flat -maxdepth 1 -type f | sort)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease=false \
              --latest
            exit 0
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --prerelease=false \
            --latest

      - name: Assume Aliyun OIDC role
        id: aliyun-oidc
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: acs:ram::5590716371345016:role/gha-ktaiorg-kt-opencode-prod
          oidc-provider-arn: acs:ram::5590716371345016:oidc-provider/github-actions-KT-Settlement
          audience: sts.aliyuncs.com
          role-session-name: kito-oss-publish

      # Mirror the same assets to OSS so download.ktai.im (Aliyun CDN) serves
      # them for China users; GitHub Release remains the byte source of truth
      # and Release Service keeps pointing at GitHub URLs.
      - name: Mirror installers to OSS
        shell: bash
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-id }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-secret }}
          ALIYUN_SECURITY_TOKEN: ${{ steps.aliyun-oidc.outputs.aliyun-security-token }}
          OSS_BUCKET: kontian-assets
          OSS_REGION: oss-us-west-1
          OSS_PUBLIC_BASE_URL: https://download.ktai.im
        run: |
          set -euo pipefail
          pip3 install --quiet 'oss2<3'
          cat > /tmp/mirror_oss.py <<'PY'
          import os, sys, pathlib
          import oss2

          bucket_name, region, prefix = sys.argv[1], sys.argv[2], sys.argv[3]
          auth = oss2.StsAuth(
              os.environ["ALIYUN_ACCESS_KEY_ID"],
              os.environ["ALIYUN_ACCESS_KEY_SECRET"],
              os.environ["ALIYUN_SECURITY_TOKEN"],
          )
          bucket = oss2.Bucket(auth, f"https://{region}.aliyuncs.com", bucket_name)
          files = sorted(pathlib.Path("release-assets-flat").iterdir())
          for path in files:
              key = f"{prefix}/{path.name}"
              headers = {"Cache-Control": "public, max-age=31536000, immutable"}
              bucket.put_object_from_file(key, str(path), headers=headers)
              print(f"oss://{bucket_name}/{key}")
          print(f"public base: {os.environ['OSS_PUBLIC_BASE_URL']}/{prefix}/")
          PY
          python3 /tmp/mirror_oss.py "$OSS_BUCKET" "$OSS_REGION" "kito/releases/${RELEASE_TAG}"
