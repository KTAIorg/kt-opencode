# Action baseline verified 2026-10-13 from official GitHub releases.
name: typecheck

on:
  push:
    branches: [main, dev, v2]
  pull_request:
    branches: [main, dev, v2]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun turbo typecheck --concurrency=3

      - name: Check generated HTTP contract and client
        run: |
          bun run --cwd packages/protocol check:generated
          bun run --cwd packages/client check:generated
          bun run sync:kito-contract --check
