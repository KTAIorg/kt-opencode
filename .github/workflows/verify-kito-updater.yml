# Action baseline verified 2026-10-14 from official GitHub releases.
name: Verify Kito Updater
run-name: Update verification | ${{ inputs.version }} | ${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Kito version assigned by Release Service
        required: true
      current_version:
        description: Version before the update
        default: "2.1.16"
        required: true
      device_id:
        description: Release Service verification device (allowlist before full rollout)
        default: "kito-updater-verifier"
        required: true
      platform:
        type: choice
        options: [windows-2025, macos-15]
        default: windows-2025
      download:
        type: boolean
        description: Download through the real Electron updater and verify checksums
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 20
    env:
      KITO_UPDATE_VERIFY_VERSION: ${{ inputs.version }}
      KITO_UPDATE_VERIFY_DEVICE_ID: ${{ inputs.device_id }}
      KITO_UPDATE_VERIFY_DOWNLOAD: ${{ inputs.download && '1' || '0' }}
      KITO_UPDATE_VERIFY_PUBLISHER: ${{ vars.WINDOWS_CSC_EXPECTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Build isolated Electron verification harness
        shell: bash
        env:
          KITO_UPDATE_VERIFY_CURRENT: ${{ inputs.current_version }}
        run: |
          set -euo pipefail
          mkdir -p packages/desktop/.updater-verifier
          bun build packages/desktop/scripts/verify-kito-updater.ts --target=node \
            --external electron --external electron-updater \
            --outfile packages/desktop/.updater-verifier/main.mjs
          bun -e 'await Bun.write("packages/desktop/.updater-verifier/package.json", JSON.stringify({name:"kito-updater-verification",version:process.env.KITO_UPDATE_VERIFY_CURRENT,main:"main.mjs",type:"module"}))'
          bun -e 'await Bun.write("packages/desktop/.updater-verifier/dev-app-update.yml", JSON.stringify({provider:"github",owner:"KTAIorg",repo:"kt-opencode",updaterCacheDirName:"kito-updater-verification-cache",...(process.env.KITO_UPDATE_VERIFY_PUBLISHER?{publisherName:[process.env.KITO_UPDATE_VERIFY_PUBLISHER]}:{})}))'
      - name: Verify actual update check and download
        shell: bash
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          export KITO_UPDATE_VERIFY_PROFILE="$RUNNER_TEMP/kito-updater-verification"
          bunx electron .updater-verifier 2>&1 | tee "$RUNNER_TEMP/kito-updater-verification.log"
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kito-updater-${{ inputs.platform }}-${{ inputs.version }}
          path: ${{ runner.temp }}/kito-updater-verification.log
